<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini To-Do App</title>
  <link rel="stylesheet" href="todo.css" />
</head>
<body>
  <section class="app">
    <h1>Mini To-Do App</h1>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Add a new task" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
  </section>
  <script src="todo.js"></script>
</body>
</html>
